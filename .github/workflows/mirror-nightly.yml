name: Mirror EmulatorJS Nightly CDN

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Mirror nightly data
        run: wget -r -np -nH --cut-dirs=2 -e robots=off --reject "index.html*" -P nightly https://cdn.emulatorjs.org/nightly/data/ 2>&1 || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nightly/
          git diff --cached --quiet || git commit -m "update nightly"
          git push
