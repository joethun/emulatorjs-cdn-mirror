name: Mirror EmulatorJS Stable CDN

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Mirror stable data
        run: wget -r -np -nH --cut-dirs=2 -e robots=off --reject "index.html*" -P stable https://cdn.emulatorjs.org/stable/data/ 2>&1 || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stable/
          git diff --cached --quiet || git commit -m "update stable"
          git push
